trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'

- script: |
    python -m pip install --upgrade pip
    pip install flask
  displayName: Install dependencies

- script: |
    python -c "import app; print('App imported successfully')"
  displayName: Basic import test